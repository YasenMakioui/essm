# GoReleaser config — https://goreleaser.com
version: 2

project_name: essm

before:
  hooks:
    - go mod tidy

builds:
  - id: essm
    main: .
    binary: essm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: essm
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

# The commit history is prototype-era; ship curated notes instead of a raw log.
changelog:
  disable: true

release:
  github:
    owner: YasenMakioui
    name: essm
  header: |
    ## essm v1.0.0 — first stable release 🎉

    A tiny terminal UI for finding EC2 instances and connecting to them over SSM —
    no more hunting for instance IDs or `Name` tags.

    ### Highlights
    - **Instance list with live SSM reachability** — see at a glance which instances
      you can actually reach (`● online` / `○ offline`).
    - **Search** by instance ID or Name (`/`).
    - **On-demand detail panel** (`i`) — type, AMI, private/public IP, subnet, VPC,
      IAM instance profile, security groups, volumes, and tags — loaded only when asked.
    - **One-key connect** (`Enter`) via `aws ssm start-session`.
    - **Auto-refresh** every 30s, plus manual refresh (`r`).

    Read-only by design: essm never starts, stops, or modifies instances.

    ### Install
    `go install github.com/YasenMakioui/essm@latest`, or download a binary below.

    ### Requirements
    AWS CLI v2 + the Session Manager plugin, valid AWS credentials, and IAM permission
    for `ec2:DescribeInstances`, `ssm:DescribeInstanceInformation`, and `ssm:StartSession`.
    See the [README](https://github.com/YasenMakioui/essm#readme).
